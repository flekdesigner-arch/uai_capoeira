    <!-- =========================================================
         PATCH PWA INSTALL — CAPTURA GLOBAL DO PROMPT
         O evento beforeinstallprompt pode acontecer antes do Flutter
         carregar a tela da Área do Aluno. Guardamos o evento no window
         para que qualquer módulo lazy possa usá-lo depois.
         ========================================================= -->
    <script>
      (() => {
        let deferredInstallPrompt = null;

        const isStandalone = () =>
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;

        const notifyAvailability = () => {
          window.__uaiPwaInstallAvailable =
            !!deferredInstallPrompt && !isStandalone();

          window.dispatchEvent(
            new CustomEvent('uai-pwa-install-available', {
              detail: window.__uaiPwaInstallAvailable
            })
          );
        };

        window.__uaiPwaInstallAvailable = false;
        window.__uaiPwaIsInstalled = isStandalone();

        window.addEventListener('beforeinstallprompt', (event) => {
          // Impede o mini-infobar automático e preserva o prompt para o
          // botão INSTALAR da Área do Aluno / painel.
          event.preventDefault();
          deferredInstallPrompt = event;
          window.__uaiPwaIsInstalled = false;
          notifyAvailability();
        });

        window.addEventListener('appinstalled', () => {
          deferredInstallPrompt = null;
          window.__uaiPwaInstallAvailable = false;
          window.__uaiPwaIsInstalled = true;
          notifyAvailability();
        });

        // Bridge por CustomEvent (sem dart:js_util no lado Flutter).
        const emitInstallState = () => {
          window.dispatchEvent(
            new CustomEvent('uai-pwa-install-state', {
              detail: (!!deferredInstallPrompt && !isStandalone()) ? '1' : '0'
            })
          );
        };

        window.addEventListener('uai-pwa-install-state-request', emitInstallState);

        window.addEventListener('uai-pwa-install-request', async (event) => {
          const requestId = String(event?.detail || '');
          let accepted = false;

          if (isStandalone()) {
            accepted = true;
          } else if (deferredInstallPrompt) {
            try {
              await deferredInstallPrompt.prompt();
              const choice = await deferredInstallPrompt.userChoice;
              accepted = !!choice && choice.outcome === 'accepted';
            } catch (_) {
              accepted = false;
            }

            // O evento beforeinstallprompt é de uso único.
            deferredInstallPrompt = null;
            window.__uaiPwaInstallAvailable = false;
            notifyAvailability();
          }

          window.dispatchEvent(
            new CustomEvent('uai-pwa-install-result', {
              detail: `${requestId}|${accepted ? '1' : '0'}`
            })
          );

          emitInstallState();
        });
      })();
    </script>

        document.head.appendChild(script);

        removeSplash();

        // Dá prioridade para pintura/layout do primeiro frame.
        if ('requestIdleCallback' in window) {
            requestIdleCallback(loadSecondaryGoogleSdks, { timeout: 2500 });
        } else {
            setTimeout(loadSecondaryGoogleSdks, 1200);
        }
    }, { once: true });

    // Apenas proteção contra splash presa em falha inesperada.
    setTimeout(removeSplash, 8000);
</script>

<!-- PATCH PWA INSTALL: SW RÁPIDO, MAS FORA DO PRIMEIRO FRAME -->
<script>
    (() => {
        let swRegistrationStarted = false;

        const registerUaiServiceWorker = () => {
            if (swRegistrationStarted || !('serviceWorker' in navigator)) return;
            swRegistrationStarted = true;

            navigator.serviceWorker
                .register('/service_worker.js', { scope: '/' })
                .catch(() => {
                    // Não bloqueia nem polui o console do PWA em produção.
                    swRegistrationStarted = false;
                });
        };

        // Caminho preferido: primeiro frame já apareceu; então o SW pode
        // registrar sem competir com o boot visual e sem esperar 3,5 segundos.
        window.addEventListener('flutter-first-frame', () => {
            setTimeout(registerUaiServiceWorker, 120);
        }, { once: true });

        // Fallback para qualquer cenário onde o evento Flutter não dispare.
        window.addEventListener('load', () => {
            setTimeout(registerUaiServiceWorker, 900);
        }, { once: true });

        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.body.classList.add('pwa-mode');
        }
    })();
</script>
