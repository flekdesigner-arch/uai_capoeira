name: uai_capoeira
description: "Sistema de gestão para academia de capoeira UAI CAPOEIRA"
publish_to: 'none'
version: 2.0.159+159

# =============================================
# 🔧 VERSÕES DO SDK
# =============================================
environment:
  sdk: ">=3.10.8 <4.0.0"
  flutter: ">=3.22.0"

# =============================================
# 📦 DEPENDÊNCIAS PRINCIPAIS (PRODUÇÃO)
# =============================================
dependencies:
  # 🌍 FLUTTER SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UAI Rhythm Studio — sampler de baixa latência (Windows/Android/PWA)
  flutter_soloud: ^3.5.4

  # =============================================
  # 🔥 FIREBASE (Backend completo)
  # =============================================
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  firebase_app_check: ^0.4.6
  firebase_analytics: ^12.4.6
  cloud_functions: ^6.3.6

  # 🔐 Login com Google
  google_sign_in: ^6.1.5
  shared_preferences: ^2.3.3

  # 🎵 UAI Rhythm Studio — player multiplataforma
  # Android + PWA/Web pelo just_audio.
  # Windows usa o backend WinRT hardened, compatível com WAV/assets e com
  # callbacks corretamente enviados para a platform thread.

  # =============================================
  # 🎨 INTERFACE E ANIMAÇÕES
  # =============================================
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  path_drawing: ^1.0.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  confetti: ^0.7.0
  flutter_colorpicker: ^1.1.0

  # =============================================
  # 📄 MANIPULAÇÃO DE DOCUMENTOS
  # =============================================
  pdf: ^3.10.7
  printing: ^5.11.1
  flutter_pdfview: ^1.3.2
  file_saver: ^0.2.14
  excel: ^2.0.0
  csv: ^6.0.0
  xml: ^6.3.0
  archive: ^3.4.10
  file_selector: ^1.0.3

  # =============================================
  # 🖼️ IMAGENS E ARQUIVOS
  # =============================================
  image_picker: ^1.1.2
  camera: 0.11.0+2
  cached_network_image: ^3.3.1
  file_picker: ^8.1.2
  flutter_cache_manager: ^3.3.0

  # =============================================
  # 🌐 INTERNET E REDE
  # =============================================
  http: ^1.2.1
  connectivity_plus: ^6.0.0
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.12.0
  webview_flutter_windows: ^1.2.0
  universal_html: ^2.2.4

  # =============================================
  # 📁 ARQUIVOS E PERMISSÕES
  # =============================================
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  open_filex: ^4.4.0

  # =============================================
  # 📱 INFORMAÇÕES DO DISPOSITIVO
  # =============================================
  package_info_plus: ^8.0.0
  device_info_plus: ^9.1.0

  # =============================================
  # 📅 DATAS E FORMATAÇÃO
  # =============================================
  intl: ^0.20.2

  # =============================================
  # 🔗 INTEGRAÇÕES
  # =============================================
  url_launcher: ^6.3.0
  share_plus: ^10.0.0

  # =============================================
  # 🔔 NOTIFICAÇÕES
  # =============================================
  flutter_local_notifications: ^17.2.0

  # =============================================
  # 📊 GRÁFICOS
  # =============================================
  fl_chart: ^0.68.0

  # =============================================
  # 🛠️ UTILITÁRIOS
  # =============================================
  collection: ^1.18.0
  async: ^2.11.0
  uuid: ^4.4.0
  crypto: ^3.0.6

  # =============================================
  # 📊 GOOGLE SHEETS (Integração)
  # =============================================
  googleapis: ^13.0.0
  googleapis_auth: ^1.5.0

  # =============================================
  # 💾 BANCO DE DADOS LOCAL (Offline)
  # =============================================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  web: ^1.1.1

  # 🎵 UAI Rhythm Studio (Android / Web / Windows)

# =============================================
# 🛠️ DEPENDÊNCIAS DE DESENVOLVIMENTO
# =============================================
  image: any
  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

# =============================================
# 🎨 CONFIGURAÇÃO DO FLUTTER
# =============================================
  firebase_core_platform_interface: any
flutter:
  uses-material-design: true

  # 📁 ARQUIVOS ESTÁTICOS
  assets:
    # 🖼️ Imagens
    - assets/images/
    - assets/certificados/
    - assets/fontes/
    - assets/images/fundo_aniversario_app_flutter.png
    - assets/images/logo_uai.png
    - assets/images/google_logo.png
    - assets/logoprincipal.png
    - assets/images/logo_uai_tema.svg
    - assets/logo_uai_tema_seguro.svg
    - assets/uai_capoeira_logo.svg
    - assets/rhythm_studio/
    - assets/rhythm_studio/berimbau_visual/
    - assets/rhythm_studio/icons/
    # 🎵 Rhythm Studio V2 — banco WAV 48 kHz por instrumento.
    # As subpastas são declaradas explicitamente para Android/PWA/Windows.
    - assets/rhythm_studio/samples_v2/berimbau/
    - assets/rhythm_studio/samples_v2/berimbau/gunga/
    - assets/rhythm_studio/samples_v2/berimbau/medio/
    - assets/rhythm_studio/samples_v2/berimbau/viola/
    - assets/rhythm_studio/samples_v2/pandeiro/
    - assets/rhythm_studio/samples_v2/atabaque/
    - assets/rhythm_studio/samples_v2/agogo/
    - assets/rhythm_studio/samples_v2/palmas/
    # 🎙️ Rhythm Studio V3 — berimbau real capturado e afinado virtualmente.
    # O banco V2 continua empacotado como fallback/reversão segura.
    - assets/rhythm_studio/samples_v3/berimbau_capturado/gunga/
    - assets/rhythm_studio/samples_v3/berimbau_capturado/medio/
    - assets/rhythm_studio/samples_v3/berimbau_capturado/viola/
    - assets/rhythm_studio/samples_v3_1/berimbau_harmonizado/gunga/
    - assets/rhythm_studio/samples_v3_1/berimbau_harmonizado/medio/
    - assets/rhythm_studio/samples_v3_1/berimbau_harmonizado/viola/
    - assets/rhythm_studio/samples_v3_2/berimbau_premium/gunga/
    - assets/rhythm_studio/samples_v3_2/berimbau_premium/medio/
    - assets/rhythm_studio/samples_v3_2/berimbau_premium/viola/
    - assets/rhythm_studio/samples_v4/berimbau_real_rr/gunga/
    - assets/rhythm_studio/samples_v4/berimbau_real_rr/medio/
    - assets/rhythm_studio/samples_v4/berimbau_real_rr/viola/

    # 🔤 PATCH SITE 08 — fontes especiais como assets puros.
    # Continuam disponíveis para certificados/PDF via rootBundle,
    # sem ficarem registradas globalmente como famílias de UI.
    - assets/fontes/ARIALN.TTF
    - assets/fontes/ARIALNB.TTF
    - assets/fontes/ARIALNBI.TTF
    - assets/fontes/ARIALNI.TTF
    - assets/fontes/ARLRDBD.TTF
    - assets/fontes/ariblk.ttf
    - assets/fontes/Square721 BT Roman.ttf
    - assets/fontes/Square721 BT Bold.ttf
    - assets/fontes/Square721 Cn BT Roman.ttf
    - assets/fontes/Square721 Cn BT Bold.ttf
    - assets/fontes/EngraversGothic BT.ttf
    - assets/fontes/Angelina Malika Personal Use.ttf
    - assets/fontes/Autography.otf
    - assets/fontes/Photograph Signature.ttf
    - assets/fontes/Bigtimes.otf

    # 📊 Dados de migração
    - assets/dadosalunos.csv
    - assets/alunos.json
    - assets/log_presenca_alunos_1.json
    - assets/log_presenca_alunos_2.json
    - assets/log_presenca_alunos_3.json
    - assets/eventos.json
    - assets/participacao_alunos_eventos.json
    - assets/graduacoes.csv

    # 🔐 Credenciais privadas NÃO podem ser empacotadas no cliente.
    # A integração Google Sheets usa Cloud Function autenticada (Patch Site 13).

  # 🔤 FONTES DE UI
  #
  # PATCH SITE 08:
  # - Arial permanece registrada globalmente porque ainda é usada em UI interna.
  # - Fontes de certificados/PDF continuam como assets e são carregadas sob demanda.
  fonts:
    - family: Arial
      fonts:
        - asset: assets/fontes/arial.ttf
        - asset: assets/fontes/arialbd.ttf
          weight: 700
        - asset: assets/fontes/ariali.ttf
          style: italic
        - asset: assets/fontes/arialbi.ttf
          weight: 700
          style: italic
    - family: Bigtimes
      fonts:
        - asset: assets/fontes/Bigtimes.otf

    - family: PhotographSignature
      fonts:
        - asset: assets/fontes/Photograph Signature.ttf

# =============================================
# 🎨 CONFIGURAÇÃO DE ÍCONES DO APP
# =============================================
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    background_color: "#B71C1C"
    theme_color: "#B71C1C"
  image_path: "assets/images/logo_uai.png"
  adaptive_icon_background: "#B71C1C"
  adaptive_icon_foreground: "assets/images/logo_uai.png"
  min_sdk_android: 21
