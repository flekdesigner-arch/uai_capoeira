# UAI Capoeira — configuracao do analisador Dart/Flutter.
# Mantem os lints recomendados pelo pacote flutter_lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Diretorios legados de patches fora do codigo compilado.
  exclude:
    - 'PATCH_ATUALIZADOR_WIFI/**'
    - 'PATCH_UAI_SMART_UPDATE_V3/**'

linter:
  rules: {}
